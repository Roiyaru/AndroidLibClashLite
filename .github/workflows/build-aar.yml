name: Build libclash.aar (HevFix)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build patched libclash.aar
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch upstream sources
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.19.34-android.1 https://github.com/Asterisk4Magisk/AndroidLibClashLite upstream
          patch -d upstream -p1 < patches/delegate-init-go.patch

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          licenses_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$licenses_status" -ne 0 ]; then
            echo "::error::Failed to accept Android SDK licenses."
            exit "$licenses_status"
          fi
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          available_packages="$(sdkmanager --list | awk '{ print $1 }')"
          ndk_package="$(printf '%s\n' "$available_packages" | awk '$1 ~ /^ndk;[0-9]/ { print $1 }' | sort -V | tail -n 1)"
          if [ -z "$ndk_package" ]; then
            echo "::error::No Android NDK package is available from sdkmanager."
            exit 1
          fi
          sdkmanager --install "$ndk_package"
          ndk_version="${ndk_package#ndk;}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build libclash.aar
        run: |
          set -euo pipefail
          python3 upstream/scripts/build_go.py --arch arm64 --api 26 --output libclash.aar --work-dir build-work 2>&1 | tee build.log
          ls -la libclash.aar

      - name: Upload build logs on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-logs
          name: CI build logs
          files: |
            build.log
            build-work/*.log

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.19.34-android.1-fix1
          name: v1.19.34-android.1-fix1 (HevFix)
          body: |
            Patched libclash.aar for AsteriskMETA Hev TUN process attribution.
            - go/native/delegate/init.go: fall back to metadata address fields when
              raw socket addresses are nil (SOCKS inbound), so UID lookup works for
              connections forwarded by the patched hev-socks5-tunnel.
          files: |
            libclash.aar
